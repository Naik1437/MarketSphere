name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketsphere
          POSTGRES_PASSWORD: changeme_local_only
          POSTGRES_DB: marketsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://marketsphere:changeme_local_only@localhost:5432/marketsphere?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/python-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest

  security-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
      - name: Check for committed secrets
        run: "! git ls-files | grep -E '^\\.env$'"
      - name: Audit API npm dependencies
        run: cd apps/api && npm ci && npm audit --audit-level=high
      - name: Audit Web npm dependencies
        run: cd apps/web && npm ci && npm audit --audit-level=high

  docker-build-and-publish:
    needs: [web, api, python-engine, security-and-compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: docker compose build
      - name: Tag and push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in web api python-engine; do
            docker tag "marketsphere-${svc}:latest" "ghcr.io/${OWNER}/marketsphere-${svc}:${{ github.sha }}"
            docker tag "marketsphere-${svc}:latest" "ghcr.io/${OWNER}/marketsphere-${svc}:latest"
            docker push "ghcr.io/${OWNER}/marketsphere-${svc}:${{ github.sha }}"
            docker push "ghcr.io/${OWNER}/marketsphere-${svc}:latest"
          done

  deploy-staging:
    needs: [docker-build-and-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy to staging
        run: ssh "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" "cd /opt/marketsphere && ./deploy/scripts/deploy.sh ${{ github.sha }}"

  # Production deployment requires GitHub Environment 'production' with required reviewers configured in Repository Settings -> Environments.
  deploy-production:
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PROD_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy to production with rollback
        run: ssh "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" "cd /opt/marketsphere && ./deploy/scripts/deploy.sh ${{ github.sha }}"
